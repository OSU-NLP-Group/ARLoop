[build-system]
requires = [
    "setuptools>=68.2.2",
    "wheel>=0.41.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "arloop"
version = "0.1.0"
readme = "README.md"
description = "ARLoop paper training, data preparation, and evaluation"
requires-python = ">= 3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6",
  "huggingface-hub",
  "einops",
  "lightning==2.3.0.dev20240328",
  "jsonargparse[signatures]>=4.27.6",
  "requests>=2.31.0",
  "tensorboard>=2.14.0",
  "torchmetrics>=1.3.1",
  "wandb",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.15.2",
  "safetensors>=0.4.3",
  "datasets>=2.18.0",
  "transformers>=4.38.0",
  "pandas",
  "packaging",
  "ninja",
  "torchdata",
]

[project.optional-dependencies]
# toggling between different torch versions
torch221 = ["torch==2.2.1"]
torchgte240 = ["torch>=2.4.0"]
evaluation = [
  "lm_eval[hf,math]==0.4.12",
  "evaluate==0.4.6",
  "evalplus==0.3.1",
]
vllm = [
  "vllm==0.25.1",
  "lm_eval[hf,math]==0.4.12",
  "evalplus==0.3.1",
]

# only for testing
dev = [
  "pytest",
  "pytest-rerunfailures",
  "pytest-timeout",
  "transformers>=4.38.0",
  "einops",
  "protobuf",
  "docstring_parser",
  "lightning-cloud",
]

# only for data preproc
data = [
  "nbformat",
  "jupytext",
  "boto3",
  "litdata>=0.2.2",
  "requests",
  "zstandard",
  "pandas",
  "pyarrow",
]

quant = [
  "bitsandbytes==0.42.0",
  "scipy",
]

[project.entry-points."vllm.general_plugins"]
register_arloop = "loopedlm.vllm:register"

[tool.setuptools.packages.find]
include = [
    "loopedlm",
    "loopedlm.*",
    "recpre",
    "recpre.*",
]
exclude = []

[tool.setuptools.package-data]
loopedlm = [
    "LICENSE",
    "README.md",
]
recpre = [
    "LICENSE",
    "README.md",
]
