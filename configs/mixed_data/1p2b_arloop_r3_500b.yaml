run_name: 1p2b_arloop_r3_500b
out_dir: outputs/1p2b_arloop_r3_500b
resume: false
resume_checkpoint_path: null
resume_model_only: false
resume_data_state: true
resume_wandb_run: false
resume_use_checkpoint_out_dir: false
max_tokens: 500000000000
max_steps: null
max_flops: null
token_to_param_ratio: null
exit_at_step: null
seed: 42
model_name: largescale-arloop-1p2b
model_impl: dynamic
block_size: 4096
ignore_block_size_mismatch: false
model_checkpoint: null
model_overwrite:
  block_size: 4096
  vocab_size: 49152
  padding_multiple: 64
  n_embd: 2048
  n_layer: 24
  loop_count: 3
  attnres_block_size: 24
  use_value_embeddings: true
  attnres_sliding_window: true
  sw_blocks: 3
  num_attention_heads: 16
  num_key_value_heads: 4
  intermediate_size: 5632
  mlp_class_name: GatedMLP
  nonlin_name: SiLU
  attention_dropout: 0.0
world_batch_size: 512
micro_batch_size: 4
batch_size_ramp: 0
optimizer: AdamW
optim_config:
  lr: 0.002
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
grad_clip: 1.0
warmup_steps: 1000.0
cooldown_steps: 0.0
lr_schedule: cosine
min_lr: 2.0e-05
no_weight_decay_for_bias_and_norm_params: false
loss_ignore_index: -100
label_smoothing: 0.0
z_regularization: 0.0
fabric_strategy: ddp
fabric_precision: bf16-mixed
fabric_use_lightning_environment: false
fabric:
  optimize_communication: false
  all_reduce_dtype: null
  ddp_find_unused_parameters: true
  ddp_static_graph: false
  ddp_gradient_as_bucket_view: false
  ddp_bucket_cap_mb: null
  row_tensor_parallel_size: 1
  col_tensor_parallel_size: 1
  depth_tensor_parallel_size: 1
compile_model: true
compile_backend: inductor
compile_mode: default
compile_fullgraph: false
compile_dynamic: false
matmul_precision: high
dataloader_num_workers: 0
gradient_checkpointing: false
allow_nonfinite_loss: false
compiled_autograd: false
compile_optimizer: false
drop_unused_tied_lm_head: false
dynamo_ddp_config: no_optimization
skip_nonfinite_grads: true
fail_instead_of_recompile: false
logger_name: wandb
logger_entity: ''
logger_project: arloop
logger_group: 1p2b_arloop_r3_500b
model_telemetry: true
extreme_telemetry: false
shape_watching_steps: 3
log_step_interval: 1
measure_utilization: true
eval_iters: 16
eval_num_sequences: 2048
eval_precision: same
cache_validation_batches: true
validation_batch_cache_dir: null
eval_step_interval: 256
save_step_interval: 10240
save_optimizer_step_interval: 1250
save_wallclock_interval_seconds: null
save_first_step: false
save_last_step: true
save_n_min_before_job_done: null
max_checkpoints_to_keep: 50
shuffle_filenames: true
shuffle_blocks: true
packed_sequence_shuffle_chunk_size: 512
